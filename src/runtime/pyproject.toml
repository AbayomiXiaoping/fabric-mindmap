[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-intelligence"
version = "0.1.0"
description = "Local Python Runtime & MCP Server for Fabric Lakehouse Intelligence Explorer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
azure = [
    "azure-identity>=1.15.0",
]

[project.scripts]
lakehouse-intelligence = "lakehouse_intelligence.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["lakehouse_intelligence*"]

